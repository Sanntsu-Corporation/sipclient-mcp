name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate tag name
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "bad tag: $GITHUB_REF_NAME" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
      - name: Cross-build archives
        run: make dist proxy-dist VERSION="$GITHUB_REF_NAME"
      - name: Combine checksums
        run: |
          set -euo pipefail
          mkdir -p release
          dups=$( (cd dist/mcpd && ls *.zip; cd ../proxy && ls *.zip) | sort | uniq -d)
          if [ -n "$dups" ]; then echo "duplicate archive names: $dups" >&2; exit 1; fi
          cp dist/mcpd/*.zip dist/proxy/*.zip release/
          cat dist/mcpd/SHA256SUMS dist/proxy/SHA256SUMS > release/SHA256SUMS
          (cd release && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Verify manifest
        run: cd release && sha256sum -c SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag "${flags[@]}" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            release/*.zip release/SHA256SUMS
