# e2e/asterisk/docker-compose.yml
#
# Internal test-infrastructure Asterisk PBX for the sipclient-mcp §14.5
# interop gate. Deploy with deploy.sh, which rsyncs this directory to the
# test host and runs `docker compose up -d --build` there.
services:
  asterisk:
    build: .
    container_name: e2e-asterisk
    restart: unless-stopped
    # Host networking is deliberate: Docker NAT would rewrite RTP source
    # addresses and mask the symmetric-RTP latching behaviour (spec R10)
    # these tests exist to exercise. SIP and the RTP range bind directly
    # on the host's RIG_HOST address (ports 5070/5071; e2e-asterisk-xfer
    # uses 5080/5081).
    network_mode: host
    # conf/keys/ (generated by gen-certs.sh, gitignored) rides along inside
    # ./conf so the TLS transport's cert paths (/etc/asterisk/keys/*) exist
    # with a single bind mount. Sounds come from the
    # asterisk-core-sounds-en-* packages baked into the image; no separate
    # volume is needed for them.
    volumes:
      - ./conf:/etc/asterisk:ro

  sipp:
    build:
      context: .
      dockerfile: Dockerfile.sipp
    # No container_name (unlike asterisk, above): `docker compose run`
    # ignores it and generates its own <project>-sipp-run-<hash> name per
    # invocation regardless, confirmed empirically -- setting one here would
    # be misleading for a run-only service.
    # Not a persistent service -- invoked on demand per scenario via
    # `docker compose run --rm -T sipp <sipp args>` from smoke-test.sh.
    # "tools" keeps a bare `docker compose up -d --build` (what deploy.sh
    # runs for the default profile) from starting/keeping this container
    # running: explicitly-named `run`/`build` still work against a profiled
    # service, only bare `up` (no service argument) filters by active
    # profile -- confirmed on the lab host with Compose v5.3.1.
    profiles: ["tools"]
    # Same reasoning as the asterisk service: real source ports and RTP
    # addressing matter for the pcap-audio scenarios, and Asterisk's
    # transports bind the literal host address, not 0.0.0.0.
    network_mode: host
    # sipp derives its SIP Via branch from its own PID. In a private PID
    # namespace it's always PID 1, so consecutive `docker compose run`
    # invocations emit identical branches -- Asterisk's PJSIP transaction
    # cache then matches a later scenario as a retransmission of an
    # earlier one's already-answered transaction and replays the stale
    # response over the wrong transport. Sharing the host PID namespace
    # restores the per-invocation PID uniqueness native sipp had. This
    # also makes the container's (previously-inert, since kill() targets
    # resolved only within its own PID namespace) default CAP_KILL able
    # to signal host processes -- cap_drop/cap_add below is what
    # neutralizes that, they are not independent of this line.
    pid: host
    # Drop every default capability, re-add only NET_RAW for
    # play_pcap_audio's raw socket. Does NOT fully contain the container --
    # uid 0 + pid: host still permit host filesystem access via
    # /proc/1/root/ (gated by owner-permission bits, not capabilities);
    # cap_drop only closes CAP_KILL (host-process-tree signaling, via
    # pid: host above) and setns()-based container-hopping. Practical risk
    # summary: USAGE.md's "Host privilege model" section.
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    volumes:
      - ./scenarios:/scenarios:ro
