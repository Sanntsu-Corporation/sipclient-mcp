; e2e/asterisk/conf/pjsip.conf
;
; PJSIP-only config (chan_sip is noloaded in modules.conf). All endpoints
; below dial into the [e2e] dialplan context in extensions.conf.
;
; IDENTIFY NOTE: the SUT (sipclient-mcp) runs from an arbitrary, not
; fixed-in-advance, IP, so inbound requests from the "direct" (no
; registration) endpoints below cannot be matched by source IP. They are
; matched by SIP username instead (identify_by=username): each direct
; endpoint's name equals its auth username, and PJSIP challenges the
; INVITE with digest auth per RFC 3261 rather than requiring a prior
; REGISTER. Registered endpoints are matched the normal way, by their
; registered contact's source IP.

[global]
type = global
endpoint_identifier_order = ip,username

[transport-udp]
type = transport
protocol = udp
bind = @RIG_HOST@:5070

[transport-tcp]
type = transport
protocol = tcp
bind = @RIG_HOST@:5070

[transport-tls]
type = transport
protocol = tls
bind = @RIG_HOST@:5071
cert_file = /etc/asterisk/keys/server.crt
priv_key_file = /etc/asterisk/keys/server.key
ca_list_file = /etc/asterisk/keys/ca.crt
; method left "unspecified" negotiates down to a protocol version too old
; for a default-policy OpenSSL 3 client to accept; pin TLS 1.2 explicitly.
method = tlsv1_2

; ---------------------------------------------------------------------
; e2e-uac-register -- registers first (spec "register" mode), then calls
; in using whatever contact it registered. Plain RTP, RFC 2833 DTMF.
; ---------------------------------------------------------------------
[auth-e2e-uac-register]
type = auth
auth_type = userpass
username = e2e-uac-register
password = e2e-test-only-not-a-secret

; AOR section name must equal the registering identity (the To-header
; username Asterisk's registrar matches against, per
; res_pjsip_registrar.c find_aor_name()) -- hence [e2e-uac-register]
; here, same name as the [type=endpoint] section below. PJSIP keys
; sections by (name, type), so the two coexist correctly.
[e2e-uac-register]
type = aor
max_contacts = 1
remove_existing = yes

[e2e-uac-register]
type = endpoint
context = e2e
disallow = all
allow = ulaw,alaw
dtmf_mode = rfc4733
auth = auth-e2e-uac-register
aors = e2e-uac-register

; ---------------------------------------------------------------------
; e2e-uac-direct -- dials straight in, no registration (spec "direct"
; mode). Plain RTP, RFC 2833 DTMF. This is the direct-mode baseline;
; the SRTP/inband/info endpoints below are direct-mode too.
; ---------------------------------------------------------------------
[auth-e2e-uac-direct]
type = auth
auth_type = userpass
username = e2e-uac-direct
password = e2e-test-only-not-a-secret

[e2e-uac-direct]
type = endpoint
context = e2e
disallow = all
allow = ulaw,alaw
dtmf_mode = rfc4733
auth = auth-e2e-uac-direct
identify_by = username

; ---------------------------------------------------------------------
; e2e-uac-srtp -- direct mode, SRTP required (not optimistic): SDES key
; exchange, AES_CM_128_HMAC_SHA1_80. A plain-RTP offer to this endpoint
; is rejected, so tests can assert SRTP actually happened.
; ---------------------------------------------------------------------
[auth-e2e-uac-srtp]
type = auth
auth_type = userpass
username = e2e-uac-srtp
password = e2e-test-only-not-a-secret

[e2e-uac-srtp]
type = endpoint
context = e2e
disallow = all
allow = ulaw,alaw
dtmf_mode = rfc4733
auth = auth-e2e-uac-srtp
identify_by = username
media_encryption = sdes
media_encryption_optimistic = no

; ---------------------------------------------------------------------
; e2e-uac-inband -- direct mode, inband DTMF (tones carried in the
; audio itself, no RFC 2833 events, no SIP INFO).
; ---------------------------------------------------------------------
[auth-e2e-uac-inband]
type = auth
auth_type = userpass
username = e2e-uac-inband
password = e2e-test-only-not-a-secret

[e2e-uac-inband]
type = endpoint
context = e2e
disallow = all
allow = ulaw,alaw
dtmf_mode = inband
auth = auth-e2e-uac-inband
identify_by = username

; ---------------------------------------------------------------------
; e2e-uac-info -- direct mode, DTMF via SIP INFO.
; ---------------------------------------------------------------------
[auth-e2e-uac-info]
type = auth
auth_type = userpass
username = e2e-uac-info
password = e2e-test-only-not-a-secret

[e2e-uac-info]
type = endpoint
context = e2e
disallow = all
allow = ulaw,alaw
dtmf_mode = info
auth = auth-e2e-uac-info
identify_by = username
