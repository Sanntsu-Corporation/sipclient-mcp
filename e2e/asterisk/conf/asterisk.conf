; e2e/asterisk/conf/asterisk.conf
;
; Minimal top-level config. Directory paths are left unset so Asterisk uses
; the FHS layout compiled into the Ubuntu package (/etc/asterisk,
; /var/lib/asterisk, /var/log/asterisk, etc.) — no need to restate them.
[options]
; Container CMD runs `asterisk -f`, which defaults to root; run as the
; package-provided unprivileged user/group instead.
runuser = asterisk
rungroup = asterisk
