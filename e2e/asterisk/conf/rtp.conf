; e2e/asterisk/conf/rtp.conf
;
; Explicit, narrow RTP port range to keep the host's open-port surface
; small (200 ports covers the E2E suite's concurrency needs comfortably).
; ICE/STUN are off — this is a fixed lab host reachable directly on
; RIG_HOST, not a NATted endpoint needing ICE candidate negotiation.
[general]
rtpstart = 10000
rtpend = 10200
icesupport = no
; stunaddr intentionally omitted (not just left blank): an empty value
; still makes res_rtp_asterisk try to resolve it and log an error.
