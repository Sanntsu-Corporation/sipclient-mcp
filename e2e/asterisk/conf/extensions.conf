; e2e/asterisk/conf/extensions.conf
;
; All E2E test extensions live in one context, [e2e], which every
; endpoint in pjsip.conf points its "context" at.

[general]
static = yes
writeprotect = no

[e2e]

; 600 -- Echo test: answers and loops the caller's own RTP straight back.
; This is what exercises the SUT's own encoder/decoder round-trip.
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; 601 -- Playback of a known, stable prompt (core-sounds-en
; "demo-congrats") for signalling/media inspection against known content.
exten => 601,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Hangup()

; 602 -- DTMF collect-and-echo: reads up to 8 digits (works the same
; regardless of which DTMF mode the calling endpoint uses -- rfc4733,
; inband or info) and reads them back with SayDigits so a test can
; assert on exactly what Asterisk received.
;
; The `silence/1` prompt file is LOAD-BEARING, not decoration. Read()'s
; filename argument must be non-empty or the application never waits for
; a digit at all: app_read.c sets `arglist.filename = NULL` when the
; field is empty, main/app.c's ast_app_getdata_terminator() then drives
; its read loop with `ast_strsep(&filename, '&', ...)`, and ast_strsep()
; (main/utils.c) returns NULL immediately for an empty string -- unlike
; POSIX strsep(), which yields one empty token. The loop body therefore
; never runs, ast_readstring() is never called, and Read() returns
; AST_GETDATA_COMPLETE with an empty buffer in microseconds. That is
; exactly the "returns in under 1ms with zero digits, READSTATUS=OK"
; behaviour observed here in 2026-07 and originally written off as
; undiagnosed. Verified against Asterisk 20.6.0 source on the rig, and
; empirically: `Read(DIGITS,&,8,,,10)` -- a filename argument that is
; non-empty but plays nothing -- waits the full timeout, while
; `Playback(silence/1)` followed by `Read(DIGITS,,8,,,10)` still returns
; instantly. It is the argument that matters, not the audio.
exten => 602,1,Answer()
 same => n,Read(DIGITS,silence/1,8,,,10)
 same => n,SayDigits(${DIGITS})
 same => n,Hangup()

; 603XX -- Ringing-then-answer with a controllable delay: dial 603
; followed by a 2-digit delay in seconds (00-99), e.g. 60305 sends 180
; Ringing, waits 5s, then answers and echoes. Exercises the 180
; Ringing -> 200 OK transition with a caller-chosen delay.
exten => _603XX,1,Ringing()
 same => n,Wait(${EXTEN:3:2})
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; 486 -- Reject with 486 Busy Here (never answers).
exten => 486,1,Busy()
 same => n,Hangup()

; 604 -- Reject with 404 Not Found (never answers). Hangup(1) uses
; Asterisk's hangup-cause-to-SIP-response mapping: cause 1
; (AST_CAUSE_UNALLOCATED) maps to a final 404, the same way Busy()
; above maps cause 17 to 486.
exten => 604,1,Hangup(1)

; 605 -- Long-hold: answers and holds the call open (silent -- no MOH
; sound package is installed, and none is needed since this exercises
; RFC 4028 session-timer refresh and long-call duration handling on the
; *signalling* path, not audio content) for up to an hour.
exten => 605,1,Answer()
 same => n,Wait(3600)
 same => n,Hangup()

; --- Loop-call routing: sipclient-mcp -> Asterisk -> sipclient-mcp -------
; Bridges a call TO the registered sipclient-mcp UA (e2e-uac-register is
; the only endpoint with an AOR, so it is the callee). The caller is a
; second sipclient-mcp UA (direct mode, e2e-uac-direct). This exercises
; the SUT's INBOUND path -- inbound INVITE, ringing, call_answer/reject --
; against a real PBX, which the outbound-only interop run never touched.
; Asterisk passes the caller's caller-id (From) onto the outbound leg.
;
; 720 -- ring the registered callee for up to 60s (normal answer, remote
;        disconnect, remote reject, caller-id). If the callee is not
;        registered, Dial fails and the caller gets the mapped response
;        (remote-offline test).
exten => 720,1,NoOp(loop -> e2e-uac-register, caller=${CALLERID(all)})
 same => n,Dial(PJSIP/e2e-uac-register,60)
 same => n,Hangup()

; 721 -- short 8s ring for the remote-not-answer test.
exten => 721,1,NoOp(loop -> e2e-uac-register, short ring)
 same => n,Dial(PJSIP/e2e-uac-register,8)
 same => n,Hangup()
