; e2e/asterisk-xfer/conf/pjsip.conf
;
; Call-transfer interop rig, ports 5080/5081 (spec 2026-09-26
; §7.2). xfer-a is the TRANSFERER (sipclient-mcp, direct mode, matched by
; username like e2e/asterisk's direct endpoints). The transferee and
; consultation parties are Asterisk-internal Local channels (extensions.conf).
;
; xfer-b (added 2026-09-28, CF-024) is a second, REGISTERING endpoint, added
; to exercise the multi-ua-session wave's fix on this rig: one MCP session
; now holds multiple independently-controlled UAs (limits.max_uas_per_session
; default 8, no longer pinned to 1), mirroring e2e/asterisk's
; e2e-uac-register/e2e-uac-direct pattern. Extension 720 in
; extensions.conf bridges xfer-a's outbound INVITE to xfer-b.

[global]
type = global
endpoint_identifier_order = ip,username

[transport-udp]
type = transport
protocol = udp
bind = @RIG_HOST@:5080

[transport-tcp]
type = transport
protocol = tcp
bind = @RIG_HOST@:5080

[transport-tls]
type = transport
protocol = tls
bind = @RIG_HOST@:5081
cert_file = /etc/asterisk/keys/server.crt
priv_key_file = /etc/asterisk/keys/server.key
ca_list_file = /etc/asterisk/keys/ca.crt
method = tlsv1_2

; --- xfer-a: the transferer (direct mode) -----------------------------------
[auth-xfer-a]
type = auth
auth_type = userpass
username = xfer-a
password = e2e-test-only-not-a-secret

[xfer-a]
type = endpoint
context = xfer
disallow = all
allow = ulaw,alaw
dtmf_mode = rfc4733
auth = auth-xfer-a
identify_by = username
; REFER handling (res_pjsip_refer): both are the defaults, stated because this
; rig exists to exercise them — accept REFER, and report progress by NOTIFY.
allow_transfer = yes
refer_blind_progress = yes

; --- xfer-b: registering callee (CF-024 multi-UA verification) -------------
[auth-xfer-b]
type = auth
auth_type = userpass
username = xfer-b
password = e2e-test-only-not-a-secret

; AOR section name must equal the registering identity (res_pjsip_registrar.c
; find_aor_name() matches the REGISTER To-header username) — same pattern as
; e2e/asterisk's e2e-uac-register.
[xfer-b]
type = aor
max_contacts = 1
remove_existing = yes

[xfer-b]
type = endpoint
context = xfer
disallow = all
allow = ulaw,alaw
dtmf_mode = rfc4733
auth = auth-xfer-b
aors = xfer-b
