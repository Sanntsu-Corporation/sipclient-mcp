; e2e/asterisk-xfer/conf/extensions.conf — every endpoint's context is [xfer].
; A blind transfer's Refer-To <sip:700@...> is looked up in the TRANSFERER's
; context, i.e. here.

[general]
static = yes
writeprotect = no

[xfer]
; 700 -- blind-transfer target: answers, plays a beep, then echoes.
; The beep matters: the transferee reaching 700 is already Up (it's the far
; end of an already-answered Local-channel bridge), so a bare Answer() emits
; no ANSWER control frame, and a bare Echo() writes nothing until it hears
; something. res_pjsip_refer's progress framehook (Asterisk 20.6.0/pjproject
; 2.14.1) only reports transfer success (NOTIFY 200) on a written ANSWER
; frame, a written VOICE frame, or the transferee joining a bridge -- with
; none of those, Asterisk sends NO NOTIFY at all until the implicit refer
; subscription's own 600 s expiry (PJSIP_XFER_EXPIRES), confirmed 2026-09-27
; against real Asterisk with a two-sided packet capture. Playback() supplies
; the missing voice frames; the transfer then reports success ~40 ms after
; the REFER's 202.
exten => 700,1,Answer()
 same => n,Playback(beep)
 same => n,Set(TIMEOUT(absolute)=30) ; bounded: a transferee Local pair would otherwise echo forever
 same => n,Echo()
 same => n,Hangup()

; 710 -- A's call to "party B", bridged: the call A later transfers. Dialing a
; Local channel (rather than answering here) is what puts A's channel in a
; BRIDGE — a REFER transfers the OTHER bridge party, Local/party-b...;1.
exten => 710,1,Dial(Local/party-b@xfer-parties,60)
 same => n,Hangup()

; 711 -- A's call to "party C", bridged: the attended-transfer consultation call.
exten => 711,1,Dial(Local/party-c@xfer-parties,60)
 same => n,Hangup()

; 720 -- CF-024 multi-UA verification: ring the registered xfer-b callee for
; up to 30s. Mirrors e2e/asterisk's 720 (loop -> e2e-uac-register).
; xfer-a (direct mode) is the
; caller.
exten => 720,1,NoOp(cf024 -> xfer-b, caller=${CALLERID(all)})
 same => n,Dial(PJSIP/xfer-b,30)
 same => n,Hangup()

[xfer-parties]
exten => party-b,1,Answer()
 same => n,Echo()
 same => n,Hangup()
exten => party-c,1,Answer()
 same => n,Echo()
 same => n,Hangup()
